[package]
name = "corefab"
version = "0.1.0"
edition = "2021"
description = "ICore Constitutional Execution Engine"
authors = ["Sir Collins <access1@tutamail.com>"]
license = "CC-BY-NC-SA-4.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }

[lib]
name = "corefab"
path = "src/lib.rs"

[[bin]]
name = "corefab"
path = "src/main.rs"
