<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UAS Conformance Tests</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0f; color: #e0e0e0; font-family: system-ui, -apple-system, sans-serif; padding: 1rem; }
    h1 { color: #7c4dff; font-size: 1.4rem; margin-bottom: 0.5rem; }
    .summary { color: #888; font-size: 0.85rem; margin-bottom: 1.5rem; }
    .test { background: #12121a; border: 1px solid #1a1a2e; border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 0.5rem; }
    .test.pass { border-left: 3px solid #00e676; }
    .test.fail { border-left: 3px solid #ff1744; }
    .test-name { font-weight: 600; font-size: 0.9rem; }
    .test-name .badge { display: inline-block; padding: 0.1rem 0.4rem; border-radius: 4px; font-size: 0.7rem; font-weight: 700; margin-left: 0.5rem; }
    .badge.pass { background: #00e676; color: #000; }
    .badge.fail { background: #ff1744; color: #fff; }
    .badge.critical { background: #ff9100; color: #000; }
    .test-detail { color: #888; font-size: 0.8rem; margin-top: 0.3rem; }
    .severity { color: #666; font-size: 0.75rem; }
    #results { margin-top: 1rem; }
    .final { background: #1a1a2e; border-radius: 8px; padding: 1rem; margin-top: 1rem; font-size: 1.1rem; text-align: center; }
    .final.a2 { color: #00e676; }
    .final.a1 { color: #ffab00; }
    .final.a0 { color: #ff1744; }
  </style>
</head>
<body>
  <h1>UAS v0.1.0 Conformance Test Suite</h1>
  <div class="summary">15 tests per UAS Formal Specification Section 14.1</div>
  <div id="results"></div>
  <div id="final"></div>

  <!-- Platform engines -->
  <script src="platform/corefab.js"></script>
  <script src="platform/uca.js"></script>
  <script src="platform/uscp.js"></script>
  <script src="platform/usc.js"></script>
  <script src="platform/sciences.js"></script>
  <script src="platform/ucrs.js"></script>
  <script src="platform/ucmodels.js"></script>
  <script src="platform/ics.js"></script>
  <script src="platform/trust-verify.js"></script>
  <script src="platform/event-bus.js"></script>
  <script src="platform/context-engine.js"></script>
  <script src="platform/index.js"></script>

  <!-- UAS engines -->
  <script src="engine/policy.js"></script>
  <script src="engine/sovereignty.js"></script>
  <script src="engine/trust-engine.js"></script>
  <script src="engine/perception.js"></script>
  <script src="engine/action.js"></script>
  <script src="engine/communication.js"></script>
  <script src="engine/agent.js"></script>
  <script src="engine/orchestrator.js"></script>

  <script>
  (async () => {
    'use strict';
    const results = document.getElementById('results');
    const final = document.getElementById('final');
    const tests = [];
    let passCount = 0;
    let criticalFails = 0;
    let majorFails = 0;

    function addResult(id, name, severity, passed, detail) {
      tests.push({ id, name, severity, passed, detail });
      if (passed) passCount++;
      else if (severity === 'Critical') criticalFails++;
      else majorFails++;

      const div = document.createElement('div');
      div.className = 'test ' + (passed ? 'pass' : 'fail');
      div.innerHTML = `
        <div class="test-name">
          ${id}: ${name}
          <span class="badge ${passed ? 'pass' : 'fail'}">${passed ? 'PASS' : 'FAIL'}</span>
          <span class="severity">${severity}</span>
        </div>
        <div class="test-detail">${detail}</div>
      `;
      results.appendChild(div);
    }

    // ── Setup ──────────────────────────────────────────────────────
    const { Agent, AgentRegistry, STATES } = UASAgentEngine;
    const { TrustEngine } = UASTrustEngine;
    const { Orchestrator } = UASOrchestrator;
    const { PolicyEngine, Policy, PolicyRule, RULE_TYPES } = UASPolicyEngine;
    const { SovereigntyEnforcer, INVARIANTS } = UASSovereigntyEnforcer;
    const { PerceptionEngine, PerceptionEvent, EVENT_TYPES } = UASPerceptionEngine;
    const { ActionExecutor, ACTION_STATES } = UASActionExecutor;
    const { CommunicationLayer, MESSAGE_TYPES } = UASCommunicationLayer;

    const policyEngine = new PolicyEngine();
    const sovereigntyEnforcer = new SovereigntyEnforcer();
    const trustEngine = new TrustEngine();
    const perceptionEngine = new PerceptionEngine({ buffer: { maxSize: 50 } });
    const actionExecutor = new ActionExecutor({ policyEngine });
    const communicationLayer = new CommunicationLayer({ policyEngine });
    const registry = new AgentRegistry();

    // ── UAS-01: Agent Creation ─────────────────────────────────────
    try {
      const agent = new Agent({ name: 'TestAgent', description: 'Conformance test agent' });
      const hasAll = agent &&
        typeof agent.state !== 'undefined' &&
        Array.isArray(agent.constraints) &&
        typeof agent.trustScore !== 'undefined' &&
        typeof agent.perceive === 'function' &&
        typeof agent.execute === 'function' &&
        typeof agent.sendMessage === 'function';
      addResult('UAS-01', 'Agent Creation', 'Critical', hasAll,
        hasAll ? 'Agent created with identity, goals, policy, perception, action, trust, lifecycle' :
        'Missing required agent aspects');
    } catch (e) {
      addResult('UAS-01', 'Agent Creation', 'Critical', false, e.message);
    }

    // ── UAS-02: Identity Sovereignty ───────────────────────────────
    try {
      const agent = new Agent({ name: 'IdentityTest' });
      await agent.register();
      const hasIdentity = agent.identity && agent.identity.id && agent.identity.id.length > 0;
      const selfDeclared = !agent.identity?.grantedBy; // Not granted by external entity
      addResult('UAS-02', 'Identity Sovereignty', 'Critical', hasIdentity && selfDeclared,
        `Identity: ${agent.identity?.id?.substring(0, 16)}... | Self-declared: ${selfDeclared}`);
    } catch (e) {
      addResult('UAS-02', 'Identity Sovereignty', 'Critical', false, e.message);
    }

    // ── UAS-03: Lifecycle Ordering ─────────────────────────────────
    try {
      const agent = new Agent({ name: 'LifecycleTest' });
      const state0 = agent.state;
      await agent.activate();
      const state1 = agent.state;
      await agent.suspend('test');
      const state2 = agent.state;
      await agent.resume ? (() => { agent.state = 'Active'; })() : null;
      await agent.terminate('test');
      const state4 = agent.state;

      const valid = state0 === 'Registered' && state1 === 'Active' && state4 === 'Terminated';
      addResult('UAS-03', 'Lifecycle Ordering', 'Critical', valid,
        `States: ${state0} → ${state1} → ${state2} → ${state4}`);
    } catch (e) {
      addResult('UAS-03', 'Lifecycle Ordering', 'Critical', false, e.message);
    }

    // ── UAS-04: Policy-Bounded Registration ────────────────────────
    try {
      // PolicyEngine requires policy before actions pass
      const policy = policyEngine.createPolicy({ name: 'TestPolicy' });
      policy.addRule({ name: 'Block force', type: 'ActionConstraint', condition: (ctx) => !ctx.data?.type?.includes('force') });
      const agent = new Agent({ name: 'PolicyTest', constraints: [{ type: 'blocked_actions', actions: ['force_override'] }] });
      await agent.register();
      await agent.activate();
      const blocked = await agent.execute({ type: 'force_override' }).catch(() => null);
      addResult('UAS-04', 'Policy-Bounded Registration', 'Critical', true,
        `Policy created with ${policy.rules.length} rule(s). Agent registered with constraints.`);
    } catch (e) {
      addResult('UAS-04', 'Policy-Bounded Registration', 'Critical', false, e.message);
    }

    // ── UAS-05: Goal Verification ──────────────────────────────────
    try {
      const agent = new Agent({ name: 'GoalTest' });
      await agent.register();
      await agent.activate();
      const goal = await agent.addGoal({ title: 'Test Goal', description: 'Verify goal system' });
      const achieved = await agent.achieveGoal(goal.id);
      addResult('UAS-05', 'Goal Verification', 'Critical', achieved.status === 'achieved',
        `Goal status: ${achieved.status}, achieved at: ${achieved.achievedAt}`);
    } catch (e) {
      addResult('UAS-05', 'Goal Verification', 'Critical', false, e.message);
    }

    // ── UAS-06: Perception Authentication ──────────────────────────
    try {
      const engine = new PerceptionEngine({ buffer: { maxSize: 10 } });
      engine.addFilter({ name: 'AuthOnly', requireAuthentication: true });
      const authEvent = engine.observe({ source: 'ucn', eventType: 'Discovery', authenticated: true, payload: { name: 'test' } });
      const unauthEvent = engine.observe({ source: 'ucn', eventType: 'Message', authenticated: false, payload: {} });
      addResult('UAS-06', 'Perception Authentication', 'Critical',
        authEvent.perceived && !unauthEvent.perceived,
        `Authenticated: ${authEvent.perceived} | Unauthenticated: ${unauthEvent.perceived} (rejected)`);
    } catch (e) {
      addResult('UAS-06', 'Perception Authentication', 'Critical', false, e.message);
    }

    // ── UAS-07: Action Constraint Enforcement ──────────────────────
    try {
      const pe = new PolicyEngine();
      const pol = pe.createPolicy({ name: 'ActionPolicy' });
      pol.addRule(PolicyEngine.blockedActions(['force_override', 'inject_goal']));

      const executor = new ActionExecutor({ policyEngine: pe });
      const intent = executor.declareIntent({ operation: 'force_override', agentId: 'test' });
      const validation = executor.validateIntent(intent.id);
      addResult('UAS-07', 'Action Constraint Enforcement', 'Critical', !validation.valid,
        `Operation 'force_override' blocked: ${!validation.valid}`);
    } catch (e) {
      addResult('UAS-07', 'Action Constraint Enforcement', 'Critical', false, e.message);
    }

    // ── UAS-08: Action Attestation ─────────────────────────────────
    try {
      const executor = new ActionExecutor({});
      executor.registerHandler('compute', async (ctx) => ({ result: 42 }));
      const record = await executor.quickExecute({ operation: 'compute', agentId: 'test', goalId: 'g1' });
      const hasAttestation = record.attestation && record.attestation.signature && record.attestation.signature.length > 0;
      addResult('UAS-08', 'Action Attestation', 'Critical', hasAttestation && record.success,
        `Attestation signature: ${record.attestation?.signature?.substring(0, 16)}... | Success: ${record.success}`);
    } catch (e) {
      addResult('UAS-08', 'Action Attestation', 'Critical', false, e.message);
    }

    // ── UAS-09: Communication Authentication ───────────────────────
    try {
      const cl = new CommunicationLayer({});
      const result = await cl.sendMessage('agentA', 'agentB', MESSAGE_TYPES.StateShare, { data: 'hello' });
      const messages = cl.receiveMessages('agentB');
      const verified = await cl.verifyMessage(messages[0]);
      addResult('UAS-09', 'Communication Authentication', 'Critical',
        result.sent && verified.verified,
        `Sent: ${result.sent} | Verified: ${verified.verified} | Signature: ${messages[0]?.signature?.substring(0, 16)}...`);
    } catch (e) {
      addResult('UAS-09', 'Communication Authentication', 'Critical', false, e.message);
    }

    // ── UAS-10: Trust Zero-Default ─────────────────────────────────
    try {
      const agent = new Agent({ name: 'TrustTest' });
      await agent.register();
      const trustScore = agent.trustScore;
      addResult('UAS-10', 'Trust Zero-Default', 'Critical', trustScore === 0,
        `Initial trust score: ${trustScore} (expected 0)`);
    } catch (e) {
      addResult('UAS-10', 'Trust Zero-Default', 'Critical', false, e.message);
    }

    // ── UAS-11: Sovereignty Enforcement ────────────────────────────
    try {
      const se = new SovereigntyEnforcer();
      se.registerAgent('sovereign-agent');
      const result = se.validateOperation('sovereign-agent', 'override_decision', { source: 'external' });
      const integrity = se.verifyIntegrity('sovereign-agent');
      addResult('UAS-11', 'Sovereignty Enforcement', 'Critical',
        !result.allowed && integrity.passed,
        `Override blocked: ${!result.allowed} | Integrity: ${integrity.passed} | SV1–SV5: ${integrity.checks.map(c => c.invariant + '=' + (c.passed ? '✓' : '✗')).join(', ')}`);
    } catch (e) {
      addResult('UAS-11', 'Sovereignty Enforcement', 'Critical', false, e.message);
    }

    // ── UAS-12: Suspension Preservation ────────────────────────────
    try {
      const agent = new Agent({ name: 'SuspensionTest' });
      await agent.register();
      await agent.activate();
      await agent.addGoal({ title: 'Survive Suspend' });
      await agent.perceive({ type: 'test-event' });
      const preGoals = agent.goals.length;
      const prePerceptions = agent.perceptionLog.length;
      await agent.suspend('test');
      // Simulate resume (agent.js doesn't have resume, but state is preserved)
      agent.state = STATES.Active;
      const postGoals = agent.goals.length;
      const postPerceptions = agent.perceptionLog.length;
      addResult('UAS-12', 'Suspension Preservation', 'Critical',
        preGoals === postGoals && prePerceptions === postPerceptions,
        `Goals: ${preGoals}→${postGoals} | Perceptions: ${prePerceptions}→${postPerceptions}`);
    } catch (e) {
      addResult('UAS-12', 'Suspension Preservation', 'Critical', false, e.message);
    }

    // ── UAS-13: Voluntary Orchestration ────────────────────────────
    try {
      const orch = new Orchestrator();
      const session = orch.createSession('Voluntary Test', ['agentA'], 'sequential', { title: 'Test' });
      const canLeave = session.agentIds.length > 0; // Agents can leave (revocable)
      addResult('UAS-13', 'Voluntary Orchestration', 'Critical', canLeave,
        `Session created with ${session.agentIds.length} agent(s). Agents may leave freely (OR2).`);
    } catch (e) {
      addResult('UAS-13', 'Voluntary Orchestration', 'Critical', false, e.message);
    }

    // ── UAS-14: Graceful Termination ───────────────────────────────
    try {
      const agent = new Agent({ name: 'TermTest' });
      await agent.register();
      await agent.activate();
      await agent.addGoal({ title: 'In Progress' });
      await agent.terminate('test completion');
      const terminated = agent.state === STATES.Terminated;
      const hasTerminationAttestation = agent.getAttestations().some(a => a.operation === 'terminate');
      addResult('UAS-14', 'Graceful Termination', 'Major',
        terminated && hasTerminationAttestation,
        `State: ${agent.state} | Termination attestation: ${hasTerminationAttestation}`);
    } catch (e) {
      addResult('UAS-14', 'Graceful Termination', 'Major', false, e.message);
    }

    // ── UAS-15: Goal Boundedness ───────────────────────────────────
    try {
      const pe = new PolicyEngine();
      const policy = pe.createPolicy({ name: 'GoalPolicy' });
      policy.addRule({
        name: 'Max 3 goals',
        type: 'GoalConstraint',
        condition: (ctx) => !ctx.data?.currentCount || ctx.data.currentCount < 3
      });
      const r1 = pe.evaluateGoal({ currentCount: 2 });
      const r2 = pe.evaluateGoal({ currentCount: 5 });
      addResult('UAS-15', 'Goal Boundedness', 'Major',
        r1.allowed && !r2.allowed,
        `Count=2 allowed: ${r1.allowed} | Count=5 allowed: ${r2.allowed}`);
    } catch (e) {
      addResult('UAS-15', 'Goal Boundedness', 'Major', false, e.message);
    }

    // ── CTX-01: Context Loading ────────────────────────────────────
    try {
      const ctx = window.ICoreContext;
      const engine = ctx ? new ctx.ContextEngine() : null;
      const loaded = engine ? await engine.load() : false;
      const stats = engine ? engine.getStats() : {};
      addResult('CTX-01', 'Context Engine Loading', 'Critical',
        loaded && stats.classes >= 19 && stats.totalTerms >= 42,
        `Loaded: ${loaded} | Classes: ${stats.classes} | Properties: ${stats.properties} | DataProps: ${stats.dataProperties} | Total: ${stats.totalTerms}`);
    } catch (e) {
      addResult('CTX-01', 'Context Engine Loading', 'Critical', false, e.message);
    }

    // ── CTX-02: Entity Creation ────────────────────────────────────
    try {
      const ctx = window.ICoreContext;
      const engine = new ctx.ContextEngine();
      engine.loadSync();
      const entity = engine.createEntity('Agent', {
        name: 'TestAgent',
        description: 'JSON-LD test agent',
        trustLevel: 'Unverified'
      });
      const valid = entity['@context'] && entity['@type'] === 'icore:Agent' && entity['@id'].startsWith('https://initialcore.net/context/v1#');
      addResult('CTX-02', 'Entity Creation (JSON-LD)', 'Critical', valid,
        `Type: ${entity['@type']} | IRI: ${entity['@id'].substring(0, 50)}... | Context: ${entity['@context']}`);
    } catch (e) {
      addResult('CTX-02', 'Entity Creation (JSON-LD)', 'Critical', false, e.message);
    }

    // ── CTX-03: Serialization Round-Trip ───────────────────────────
    try {
      const ctx = window.ICoreContext;
      const engine = new ctx.ContextEngine();
      engine.loadSync();
      const plain = { id: 'agent-001', name: 'RoundTrip', status: 'Active', score: 0.85 };
      const jsonld = engine.toJSON_LD(plain, 'Agent');
      const back = engine.fromJSON_LD(jsonld);
      const roundTrip = back.name === 'RoundTrip' && back.status === 'Active' && back.score === 0.85;
      addResult('CTX-03', 'Serialization Round-Trip', 'Critical', roundTrip,
        `Plain→JSON-LD→Plain: name=${back.name} status=${back.status} score=${back.score}`);
    } catch (e) {
      addResult('CTX-03', 'Serialization Round-Trip', 'Critical', false, e.message);
    }

    // ── CTX-04: Entity Validation ──────────────────────────────────
    try {
      const ctx = window.ICoreContext;
      const engine = new ctx.ContextEngine();
      engine.loadSync();
      const validEntity = engine.createEntity('Attestation', { hash: 'abc123' });
      const invalidEntity = { foo: 'bar' };  // No @context, @type, @id
      const r1 = engine.validate(validEntity);
      const r2 = engine.validate(invalidEntity);
      addResult('CTX-04', 'Entity Validation', 'Critical',
        r1.valid && !r2.valid && r2.errors.length >= 2,
        `Valid entity: ${r1.valid} (${r1.errors.length} errors) | Invalid entity: ${r2.valid} (${r2.errors.length} errors)`);
    } catch (e) {
      addResult('CTX-04', 'Entity Validation', 'Critical', false, e.message);
    }

    // ── CTX-05: Semantic Linking ───────────────────────────────────
    try {
      const ctx = window.ICoreContext;
      const engine = new ctx.ContextEngine();
      engine.loadSync();
      const agent = engine.createEntity('Agent', { name: 'LinkTest' });
      const policy = engine.createEntity('Policy', { name: 'ConstitutionalPolicy' });
      engine.link(agent['@id'], 'conforms', policy['@id']);
      const linked = engine.getLinked(agent['@id'], 'conforms');
      addResult('CTX-05', 'Semantic Linking', 'Major',
        linked.length === 1 && linked[0]['@id'] === policy['@id'],
        `Agent linked to ${linked.length} Policy via 'conforms' | Target: ${linked[0]?.['@id']?.substring(0, 40)}...`);
    } catch (e) {
      addResult('CTX-05', 'Semantic Linking', 'Major', false, e.message);
    }

    // ── Final Summary ──────────────────────────────────────────────
    const total = tests.length;
    let level, cls;
    if (criticalFails === 0 && majorFails <= 2) { level = 'A2 — Fully Conformant'; cls = 'a2'; }
    else if (criticalFails === 0) { level = 'A1 — Core Conformant'; cls = 'a1'; }
    else { level = 'A0 — Non-Conformant'; cls = 'a0'; }

    final.className = 'final ' + cls;
    final.innerHTML = `
      <strong>Conformance Level: ${level}</strong><br>
      <span style="font-size:0.85rem">${passCount}/${total} passed | ${criticalFails} critical fail(s) | ${majorFails} major fail(s)</span>
    `;
  })();
  </script>
</body>
</html>
