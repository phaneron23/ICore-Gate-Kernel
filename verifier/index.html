<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#00e676">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Verifier">
  <meta name="description" content="ICore Constitutional Verifier — Verify trust claims against the ICore constitutional framework.">
  <title>ICore Constitutional Verifier</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔷</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="offline-banner" class="offline-banner" style="display:none">
      ⚡ Offline Mode — All verification runs locally
    </div>

    <header class="header">
      <div class="header-inner">
        <div class="header-brand">
          <span class="header-logo">🔷</span>
          <div>
            <div class="header-title">Verifier</div>
            <div class="header-subtitle">ICore Constitutional Trust</div>
          </div>
        </div>
        <button id="install-btn" class="btn btn-secondary" onclick="App.installPWA()" style="width:auto; padding: 8px 16px; font-size: 0.8rem;">
          📱 Install
        </button>
      </div>
    </header>

    <main id="screen" class="main"></main>

    <nav class="bottom-nav">
      <div class="bottom-nav-inner">
        <button class="nav-item active" data-screen="home">
          <span class="nav-item-icon">🔍</span>
          <span>Verify</span>
        </button>
        <button class="nav-item" data-screen="results">
          <span class="nav-item-icon">📊</span>
          <span>Results</span>
        </button>
        <button class="nav-item" data-screen="history">
          <span class="nav-item-icon">📋</span>
          <span>History</span>
        </button>
      </div>
    </nav>
  </div>

  <!-- Constitutional Engine — copied from platform/ -->
  <script src="platform/corefab.js"></script>
  <script src="platform/uca.js"></script>
  <script src="platform/uscp.js"></script>
  <script src="platform/usc.js"></script>
  <script src="platform/sciences.js"></script>
  <script src="platform/ucrs.js"></script>
  <script src="platform/ucmodels.js"></script>
  <script src="platform/ics.js"></script>
  <script src="platform/trust-verify.js"></script>
  <script src="platform/event-bus.js"></script>
  <script src="platform/index.js"></script>

  <!-- UI Screens -->
  <script src="ui/home.js"></script>
  <script src="ui/results.js"></script>
  <script src="ui/history.js"></script>

  <!-- Application Controller -->
  <script src="app.js"></script>

<!-- ICore Cross-PWA Navigation -->
<script src="nav-bar.js"></script>
</body>
</html>
