<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICore Universal Cache Reset</title>
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UCR">
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#0a0a0f;--sf:#12121a;--bd:#1e1e2e;--tx:#e0e0e0;--dm:#666;--ac:#00bfa5;--gn:#00e676;--rd:#ff5252}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,'Segoe UI',Roboto,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.wrap{width:100%;max-width:480px}
.head{text-align:center;margin-bottom:24px}
.head h1{font-size:1.4rem;font-weight:700;color:var(--ac);margin-bottom:4px}
.head p{font-size:.85rem;color:var(--dm)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px}
.card h2{font-size:.95rem;font-weight:600;margin-bottom:12px;color:var(--tx)}
.row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd);font-size:.85rem}
.row:last-child{border-bottom:none}
.row .label{color:var(--dm)}
.row .val{font-family:monospace;font-size:.8rem}
.val.ok{color:var(--gn)}.val.warn{color:#ffa726}.val.err{color:var(--rd)}
.btn{background:var(--ac);color:#000;border:none;padding:14px 24px;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;width:100%;transition:opacity .2s}
.btn:hover{opacity:.9}
.btn:disabled{background:var(--bd);color:var(--dm);cursor:not-allowed}
.btn.done{background:var(--gn)}
.log{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-top:16px;font-family:monospace;font-size:.78rem;max-height:260px;overflow-y:auto;white-space:pre-wrap;line-height:1.5}
.log .ok{color:var(--gn)}.log .err{color:var(--rd)}.log .info{color:var(--dm)}.log .h{color:var(--ac);font-weight:700}
.foot{text-align:center;margin-top:16px;font-size:.75rem;color:var(--dm)}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>Universal Cache Reset</h1>
    <p>ICore constitutional platform — cache cleanup tool</p>
  </div>

  <div class="card" id="statusCard">
    <h2>Current State</h2>
    <div class="row"><span class="label">Service Workers</span><span class="val" id="swCount">—</span></div>
    <div class="row"><span class="label">Cache Storage</span><span class="val" id="cacheCount">—</span></div>
    <div class="row"><span class="label">LocalStorage</span><span class="val" id="lsCount">—</span></div>
    <div class="row"><span class="label">IndexedDB</span><span class="val" id="dbCount">—</span></div>
  </div>

  <button class="btn" id="resetBtn" onclick="resetAll()">Reset Everything</button>

  <div class="log" id="log"></div>

  <div class="foot">ICore Constitutional Platform · Sir Collins</div>
</div>

<script>
var I="initialcore.net";
var DOMAINS=[
  "usr","uwa","ucn","uca","usds","structure",
  "studio","verifier","wfengine","docs","api"
];

function el(id){return document.getElementById(id)}
function log(msg,cls){
  cls=cls||"info";
  var s=document.createElement("span");
  s.className=cls;
  s.textContent=msg;
  el("log").appendChild(s);
  el("log").appendChild(document.createTextNode("\n"));
  el("log").scrollTop=el("log").scrollHeight;
}
function setVal(id,txt,cls){
  var e=el(id);
  e.textContent=txt;
  if(cls)e.className="val "+cls;
}

async function scan(){
  // Service Workers
  var sw=0;
  if(navigator.serviceWorker){
    var r=await navigator.serviceWorker.getRegistrations();
    sw=r.length;
  }
  setVal("swCount",sw+" registered",sw?"warn":"ok");

  // Caches
  var cc=0;
  if(window.caches){
    var n=await caches.keys();
    cc=n.length;
  }
  setVal("cacheCount",cc+" entries",cc?"warn":"ok");

  // LocalStorage
  var ls=localStorage.length;
  setVal("lsCount",ls+" items",ls?"warn":"ok");

  // IndexedDB
  var dbs=0;
  if(indexedDB&&indexedDB.databases){
    try{var d=await indexedDB.databases();dbs=d.length;}catch(e){}
  }
  setVal("dbCount",dbs+" databases",dbs?"warn":"ok");

  return{sw:sw,cc:cc,ls:ls,dbs:dbs};
}

async function resetAll(){
  var btn=el("resetBtn");
  btn.disabled=true;
  btn.textContent="Clearing...";
  log("=== Universal Cache Reset ===","h");

  // 1. Service Workers
  var swN=0;
  if(navigator.serviceWorker){
    var regs=await navigator.serviceWorker.getRegistrations();
    for(var i=0;i<regs.length;i++){
      try{await regs[i].unregister();swN++;log("  SW removed: "+regs[i].scope,"ok");}
      catch(e){log("  SW fail: "+e.message,"err");}
    }
  }
  log("Service Workers: "+swN+" unregistered","h");

  // 2. Cache Storage
  var cN=0;
  if(window.caches){
    var keys=await caches.keys();
    for(var j=0;j<keys.length;j++){
      try{await caches.delete(keys[j]);cN++;log("  Cache deleted: "+keys[j],"ok");}
      catch(e){log("  Cache fail: "+keys[j],"err");}
    }
  }
  log("Caches: "+cN+" deleted","h");

  // 3. LocalStorage
  var lN=localStorage.length;
  try{localStorage.clear();}catch(e){}
  log("LocalStorage: "+lN+" items cleared","h");

  // 4. IndexedDB
  var dN=0;
  if(indexedDB&&indexedDB.databases){
    try{
      var dbs=await indexedDB.databases();
      for(var k=0;k<dbs.length;k++){
        if(dbs[k].name){indexedDB.deleteDatabase(dbs[k].name);dN++;log("  DB deleted: "+dbs[k].name,"ok");}
      }
    }catch(e){}
  }
  log("IndexedDB: "+dN+" databases cleared","h");

  // 5. Cookies (best effort)
  var cK=document.cookie.split(";");
  if(cK.length>0&&cK[0]!==""){
    document.cookie.split(";").forEach(function(c){
      var n=c.split("=")[0].trim();
      document.cookie=n+"=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
      document.cookie=n+"=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/;domain=."+I;
    });
    log("Cookies: cleared","h");
  }

  log("");
  log("=== ALL CLEAR ===","ok");
  log("");
  log("ICore domains to revisit:","info");
  log("  https://"+I+"/","info");
  DOMAINS.forEach(function(d){log("  https://"+d+"."+I+"/","info");});
  log("");
  log("Reset.initialcore.net also available","info");

  // Rescan
  await scan();
  btn.textContent="Done — Visit Sites Fresh";
  btn.className="btn done";
}

// Initial scan
scan();
</script>
</body>
</html>
