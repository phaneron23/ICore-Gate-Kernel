<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICore Universal Cache Reset</title>
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UCR">
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#0a0a0f;--sf:#12121a;--bd:#1e1e2e;--tx:#e0e0e0;--dm:#666;--ac:#00bfa5;--gn:#00e676;--rd:#ff5252;--or:#ffa726;--bl:#42a5f5}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,\'Segoe UI\',Roboto,sans-serif;padding:16px}
.wrap{max-width:520px;margin:0 auto}
.head{text-align:center;margin-bottom:16px}
.head h1{font-size:1.2rem;font-weight:700;color:var(--ac);margin-bottom:2px}
.head p{font-size:.75rem;color:var(--dm)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:.85rem;font-weight:600;margin-bottom:8px;color:var(--tx)}
.row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--bd);font-size:.8rem}
.row:last-child{border-bottom:none}
.row .label{color:var(--dm)}
.row .val{font-family:monospace;font-size:.75rem}
.val.ok{color:var(--gn)}.val.warn{color:var(--or)}.val.err{color:var(--rd)}
.btn{background:var(--ac);color:#000;border:none;padding:12px 20px;border-radius:10px;font-size:.95rem;font-weight:700;cursor:pointer;width:100%;transition:opacity .2s}
.btn:hover{opacity:.9}
.btn:disabled{background:var(--bd);color:var(--dm);cursor:not-allowed}
.btn.done{background:var(--gn)}
.site{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bd);font-size:.8rem}
.site:last-child{border-bottom:none}
.site-name{font-weight:600;min-width:70px}
.site-links{display:flex;gap:6px}
.site-links a{font-size:.7rem;padding:3px 8px;border-radius:5px;text-decoration:none;font-weight:600;display:inline-block}
.link-p{background:#1a237e;color:#90caf9}
.link-c{background:var(--bd);color:var(--tx)}
.link-p:active,.link-c:active{opacity:.7}
.log{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-top:12px;font-family:monospace;font-size:.72rem;max-height:200px;overflow-y:auto;white-space:pre-wrap;line-height:1.4}
.log .ok{color:var(--gn)}.log .err{color:var(--rd)}.log .info{color:var(--dm)}.log .h{color:var(--ac);font-weight:700}
.foot{text-align:center;margin-top:14px;font-size:.65rem;color:var(--dm)}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>Universal Cache Reset</h1>
    <p>ICore constitutional platform</p>
  </div>

  <div class="card">
    <h2>Storage Status</h2>
    <div class="row"><span class="label">Service Workers</span><span class="val" id="sw">\u2014</span></div>
    <div class="row"><span class="label">Cache Storage</span><span class="val" id="cc">\u2014</span></div>
    <div class="row"><span class="label">LocalStorage</span><span class="val" id="ls">\u2014</span></div>
    <div class="row"><span class="label">IndexedDB</span><span class="val" id="db">\u2014</span></div>
  </div>

  <button class="btn" id="resetBtn" onclick="resetAll()">Reset Everything</button>
  <div class="log" id="log"></div>

  <div class="card" style="margin-top:16px">
    <h2>All ICore Sites</h2>
    <p style="font-size:.7rem;color:var(--dm);margin-bottom:6px">Tap Pages if a custom domain fails.</p>
    <div id="sites"></div>
  </div>

  <div class="foot">ICore Constitutional Platform \u00b7 Sir Collins</div>
</div>

<script>
var S=[
["Landing","initialcore.net","8a944f9f.icore-landing-3uc.pages.dev"],
["USR","usr.initialcore.net","6ba7a41c.usr-site.pages.dev"],
["UWA","uwa.initialcore.net","ff0ea9f7.uwa-3uc.pages.dev"],
["UCN","ucn.initialcore.net","e784959c.ucn-3uc.pages.dev"],
["UCA","uca.initialcore.net","65b4bf8f.uca-3uc.pages.dev"],
["USDS","usds.initialcore.net","a2bcb22a.usds-3uc.pages.dev"],
["Structure","structure.initialcore.net","2d8777c1.structure-3uc.pages.dev"],
["Studyo","studio.initialcore.net","f6b9d553.studyo-3uc-aln.pages.dev"],
["Verifier","verifier.initialcore.net","909adee7.verifier-3uc.pages.dev"],
["Workflow","wfengine.initialcore.net","87b0eb0f.workflow-engine-3uc.pages.dev"],
["Docs","docs.initialcore.net","a3f7e2c1.docs-3uc.pages.dev"],
["API","api.initialcore.net","7297ea43.api-3uc.pages.dev"],
["Context","context.initialcore.net","9dc3fecf.context-3uc.pages.dev"],
["UCR","reset.initialcore.net","4c4e7ff9.reset-3uc.pages.dev"]
];

function log(m,c){c=c||"info";var s=document.createElement("span");s.className=c;s.textContent=m;var l=document.getElementById("log");l.appendChild(s);l.appendChild(document.createTextNode("\n"));l.scrollTop=l.scrollHeight;}
function sv(id,t,c){var e=document.getElementById(id);e.textContent=t;if(c)e.className="val "+c;}

function buildSites(){var d=document.getElementById("sites");S.forEach(function(s){var row=document.createElement("div");row.className="site";row.innerHTML=\'<span class="site-name">\'+s[0]+\'</span>\'+\'<span class="site-links">\'+\'<a class="link-p" href="https://\'+s[2]+\'/" target="_blank">Pages</a>\'+\'<a class="link-c" href="https://\'+s[1]+\'/" target="_blank">\'+s[1].replace(".initialcore.net","")+\'</a>\'+\'</span>\';d.appendChild(row);});}

async function scan(){var sw=0;if(navigator.serviceWorker){var r=await navigator.serviceWorker.getRegistrations();sw=r.length;}sv("sw",sw+" registered",sw?"warn":"ok");var cc=0;if(window.caches){var n=await caches.keys();cc=n.length;}sv("cc",cc+" entries",cc?"warn":"ok");sv("ls",localStorage.length+" items",localStorage.length?"warn":"ok");var dbs=0;if(indexedDB&&indexedDB.databases){try{var d=await indexedDB.databases();dbs=d.length;}catch(e){}}sv("db",dbs+" databases",dbs?"warn":"ok");}

async function resetAll(){var btn=document.getElementById("resetBtn");btn.disabled=true;btn.textContent="Clearing...";log("=== Universal Cache Reset ===","h");var swN=0;if(navigator.serviceWorker){var regs=await navigator.serviceWorker.getRegistrations();for(var i=0;i<regs.length;i++){try{await regs[i].unregister();swN++;log("  SW removed: "+regs[i].scope,"ok");}catch(e){log("  SW fail: "+e.message,"err");}}}log("Service Workers: "+swN+" unregistered","h");var cN=0;if(window.caches){var keys=await caches.keys();for(var j=0;j<keys.length;j++){try{await caches.delete(keys[j]);cN++;log("  Cache deleted: "+keys[j],"ok");}catch(e){log("  Cache fail: "+keys[j],"err");}}}log("Caches: "+cN+" deleted","h");var lN=localStorage.length;try{localStorage.clear();}catch(e){}log("LocalStorage: "+lN+" items cleared","h");var dN=0;if(indexedDB&&indexedDB.databases){try{var dbs=await indexedDB.databases();for(var k=0;k<dbs.length;k++){if(dbs[k].name){indexedDB.deleteDatabase(dbs[k].name);dN++;log("  DB deleted: "+dbs[k].name,"ok");}}}catch(e){}}log("IndexedDB: "+dN+" databases cleared","h");log("");log("=== ALL CLEAR ===","ok");log("Visit sites below. Use Pages if custom domains fail.","info");await scan();btn.textContent="Done";btn.className="btn done";}

buildSites();scan();
</script>
</body>
</html>
