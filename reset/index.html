<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICore Universal Cache Reset</title>
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UCR">
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#0a0a0f;--sf:#12121a;--bd:#1e1e2e;--tx:#e0e0e0;--dm:#666;--ac:#00bfa5;--gn:#00e676;--rd:#ff5252;--or:#ffa726}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,'Segoe UI',Roboto,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.wrap{width:100%;max-width:520px}
.head{text-align:center;margin-bottom:20px}
.head h1{font-size:1.3rem;font-weight:700;color:var(--ac);margin-bottom:4px}
.head p{font-size:.8rem;color:var(--dm)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
.card h2{font-size:.9rem;font-weight:600;margin-bottom:10px;color:var(--tx)}
.row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd);font-size:.8rem}
.row:last-child{border-bottom:none}
.row .label{color:var(--dm)}
.row .val{font-family:monospace;font-size:.75rem}
.val.ok{color:var(--gn)}.val.warn{color:var(--or)}.val.err{color:var(--rd)}
.site-list{margin-top:8px}
.site-item{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd);font-size:.8rem}
.site-item:last-child{border-bottom:none}
.site-name{font-weight:600;color:var(--tx)}
.site-links{display:flex;gap:8px}
.site-links a{font-size:.7rem;padding:2px 6px;border-radius:4px;text-decoration:none;font-family:monospace}
.link-custom{background:var(--bd);color:var(--tx)}
.link-pages{background:#1a237e;color:#90caf9}
.link-custom:hover,.link-pages:hover{opacity:.8}
.btn{background:var(--ac);color:#000;border:none;padding:12px 20px;border-radius:10px;font-size:.95rem;font-weight:700;cursor:pointer;width:100%;transition:opacity .2s}
.btn:hover{opacity:.9}
.btn:disabled{background:var(--bd);color:var(--dm);cursor:not-allowed}
.btn.done{background:var(--gn)}
.log{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-top:12px;font-family:monospace;font-size:.72rem;max-height:220px;overflow-y:auto;white-space:pre-wrap;line-height:1.4}
.log .ok{color:var(--gn)}.log .err{color:var(--rd)}.log .info{color:var(--dm)}.log .h{color:var(--ac);font-weight:700}
.tabs{display:flex;gap:4px;margin-bottom:12px}
.tab{flex:1;padding:8px;text-align:center;font-size:.8rem;font-weight:600;border-radius:8px;cursor:pointer;background:var(--sf);border:1px solid var(--bd);color:var(--dm)}
.tab.active{background:var(--ac);color:#000;border-color:var(--ac)}
.tab-content{display:none}.tab-content.active{display:block}
.foot{text-align:center;margin-top:12px;font-size:.7rem;color:var(--dm)}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>Universal Cache Reset</h1>
    <p>ICore constitutional platform</p>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="showTab('reset')">Reset</div>
    <div class="tab" onclick="showTab('sites')">All Sites</div>
  </div>

  <!-- RESET TAB -->
  <div class="tab-content active" id="tab-reset">
    <div class="card">
      <h2>Current State</h2>
      <div class="row"><span class="label">Service Workers</span><span class="val" id="swCount">—</span></div>
      <div class="row"><span class="label">Cache Storage</span><span class="val" id="cacheCount">—</span></div>
      <div class="row"><span class="label">LocalStorage</span><span class="val" id="lsCount">—</span></div>
      <div class="row"><span class="label">IndexedDB</span><span class="val" id="dbCount">—</span></div>
    </div>
    <button class="btn" id="resetBtn" onclick="resetAll()">Reset Everything</button>
    <div class="log" id="log"></div>
  </div>

  <!-- SITES TAB -->
  <div class="tab-content" id="tab-sites">
    <div class="card">
      <h2>ICore Platform — All Sites</h2>
      <p style="font-size:.75rem;color:var(--dm);margin-bottom:8px">If a custom domain fails, use the Pages URL.</p>
      <div class="site-list" id="siteList"></div>
    </div>
  </div>

  <div class="foot">ICore Constitutional Platform · Sir Collins</div>
</div>

<script>
var SITES=[
  {name:"Landing",custom:"initialcore.net",pages:"icore-landing-3uc.pages.dev",hash:"8a944f9f"},
  {name:"USR",custom:"usr.initialcore.net",pages:"usr-site.pages.dev",hash:"6ba7a41c"},
  {name:"UWA",custom:"uwa.initialcore.net",pages:"uwa-3uc.pages.dev",hash:"ff0ea9f7"},
  {name:"UCN",custom:"ucn.initialcore.net",pages:"ucn-3uc.pages.dev",hash:"e784959c"},
  {name:"UCA",custom:"uca.initialcore.net",pages:"uca-3uc.pages.dev",hash:"65b4bf8f"},
  {name:"USDS",custom:"usds.initialcore.net",pages:"usds-3uc.pages.dev",hash:"a2bcb22a"},
  {name:"Structure",custom:"structure.initialcore.net",pages:"structure-3uc.pages.dev",hash:"2d8777c1"},
  {name:"Studyo",custom:"studio.initialcore.net",pages:"studyo-3uc-aln.pages.dev",hash:"f6b9d553"},
  {name:"Verifier",custom:"verifier.initialcore.net",pages:"verifier-3uc.pages.dev",hash:"909adee7"},
  {name:"Workflow",custom:"wfengine.initialcore.net",pages:"workflow-engine-3uc.pages.dev",hash:"87b0eb0f"},
  {name:"Docs",custom:"docs.initialcore.net",pages:"docs-3uc.pages.dev",hash:"a3f7e2c1"},
  {name:"API",custom:"api.initialcore.net",pages:"api-3uc.pages.dev",hash:"7297ea43"},
  {name:"UCR",custom:"reset.initialcore.net",pages:"reset-3uc.pages.dev",hash:"1684e456"}
];

function el(id){return document.getElementById(id)}

function showTab(name){
  document.querySelectorAll(".tab").forEach(function(t){t.classList.remove("active")});
  document.querySelectorAll(".tab-content").forEach(function(t){t.classList.remove("active")});
  event.target.classList.add("active");
  el("tab-"+name).classList.add("active");
}

// Build site list
function buildSiteList(){
  var list=el("siteList");
  SITES.forEach(function(s){
    var item=document.createElement("div");
    item.className="site-item";
    item.innerHTML='<span class="site-name">'+s.name+'</span>'
      +'<span class="site-links">'
      +'<a class="link-pages" href="https://'+s.hash+'.'+s.pages+'/" target="_blank">Pages</a>'
      +'<a class="link-custom" href="https://'+s.custom+'/" target="_blank">'+s.custom.replace(".initialcore.net","")+'</a>'
      +'</span>';
    list.appendChild(item);
  });
}

function log(msg,cls){
  cls=cls||"info";
  var s=document.createElement("span");
  s.className=cls;
  s.textContent=msg;
  el("log").appendChild(s);
  el("log").appendChild(document.createTextNode("\n"));
  el("log").scrollTop=el("log").scrollHeight;
}

function setVal(id,txt,cls){
  var e=el(id);
  e.textContent=txt;
  if(cls)e.className="val "+cls;
}

async function scan(){
  var sw=0;
  if(navigator.serviceWorker){
    var r=await navigator.serviceWorker.getRegistrations();
    sw=r.length;
  }
  setVal("swCount",sw+" registered",sw?"warn":"ok");

  var cc=0;
  if(window.caches){
    var n=await caches.keys();
    cc=n.length;
  }
  setVal("cacheCount",cc+" entries",cc?"warn":"ok");

  var ls=localStorage.length;
  setVal("lsCount",ls+" items",ls?"warn":"ok");

  var dbs=0;
  if(indexedDB&&indexedDB.databases){
    try{var d=await indexedDB.databases();dbs=d.length;}catch(e){}
  }
  setVal("dbCount",dbs+" databases",dbs?"warn":"ok");
}

async function resetAll(){
  var btn=el("resetBtn");
  btn.disabled=true;
  btn.textContent="Clearing...";
  log("=== Universal Cache Reset ===","h");

  // 1. Service Workers
  var swN=0;
  if(navigator.serviceWorker){
    var regs=await navigator.serviceWorker.getRegistrations();
    for(var i=0;i<regs.length;i++){
      try{await regs[i].unregister();swN++;log("  SW removed: "+regs[i].scope,"ok");}
      catch(e){log("  SW fail: "+e.message,"err");}
    }
  }
  log("Service Workers: "+swN+" unregistered","h");

  // 2. Cache Storage
  var cN=0;
  if(window.caches){
    var keys=await caches.keys();
    for(var j=0;j<keys.length;j++){
      try{await caches.delete(keys[j]);cN++;log("  Cache deleted: "+keys[j],"ok");}
      catch(e){log("  Cache fail: "+keys[j],"err");}
    }
  }
  log("Caches: "+cN+" deleted","h");

  // 3. LocalStorage
  var lN=localStorage.length;
  try{localStorage.clear();}catch(e){}
  log("LocalStorage: "+lN+" items cleared","h");

  // 4. IndexedDB
  var dN=0;
  if(indexedDB&&indexedDB.databases){
    try{
      var dbs=await indexedDB.databases();
      for(var k=0;k<dbs.length;k++){
        if(dbs[k].name){indexedDB.deleteDatabase(dbs[k].name);dN++;log("  DB deleted: "+dbs[k].name,"ok");}
      }
    }catch(e){}
  }
  log("IndexedDB: "+dN+" databases cleared","h");

  // 5. Cookies
  var cK=document.cookie.split(";");
  if(cK.length>0&&cK[0]!==""){
    document.cookie.split(";").forEach(function(c){
      var n=c.split("=")[0].trim();
      document.cookie=n+"=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
    });
    log("Cookies: cleared","h");
  }

  log("");
  log("=== ALL CLEAR ===","ok");
  log("");
  log("Use the Sites tab to revisit all ICore domains.","info");
  log("If custom domains fail, use Pages URLs.","info");

  await scan();
  btn.textContent="Done";
  btn.className="btn done";
}

buildSiteList();
scan();
</script>
</body>
</html>
