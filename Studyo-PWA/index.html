<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#00e676">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Studyo">
  <meta name="description" content="ICore Studyo — Universal Constitutional Workspace">
  <title>ICore Studyo</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <div id="offline-banner" class="offline-banner" style="display:none">
      ⚡ Offline Mode — All data stays on device
    </div>

    <header class="header">
      <div class="header-inner">
        <div class="header-brand">
          <span class="header-logo">🔷</span>
          <div>
            <div class="header-title">Studyo</div>
            <div class="header-subtitle">Constitutional Workspace</div>
          </div>
        </div>
        <button id="install-btn" class="btn btn-secondary" onclick="App.installPWA()" style="width:auto; padding: 8px 16px; font-size: 0.8rem;">
          📱 Install
        </button>
      </div>
    </header>

    <main id="screen" class="main"></main>

    <nav class="bottom-nav">
      <div class="bottom-nav-inner">
        <button class="nav-item active" data-screen="home">
          <span class="nav-item-icon">🏠</span>
          <span>Home</span>
        </button>
        <button class="nav-item" data-screen="verify">
          <span class="nav-item-icon">🔍</span>
          <span>Verify</span>
        </button>
        <button class="nav-item" data-screen="explore">
          <span class="nav-item-icon">🗺️</span>
          <span>Explore</span>
        </button>
        <button class="nav-item" data-screen="history">
          <span class="nav-item-icon">📋</span>
          <span>History</span>
        </button>
        <button class="nav-item" data-screen="about">
          <span class="nav-item-icon">ℹ️</span>
          <span>About</span>
        </button>
      </div>
    </nav>
  </div>

  <!-- Constitutional Engine — Layers 1-5 -->
  <script src="/engine/uscp.js"></script>
  <script src="/engine/usc.js"></script>
  <script src="/engine/sciences.js"></script>
  <script src="/engine/ucrs.js"></script>
  <script src="/engine/ucmodels.js"></script>
  <script src="/engine/ics.js"></script>
  <script src="/engine/trust-verify.js"></script>

  <!-- Constitutional Runtime — Layer 6 -->
  <script src="/engine/corefab.js"></script>
  <script src="/engine/uca.js"></script>

  <!-- Storage -->
  <script src="/storage/db.js"></script>

  <!-- UI Screens -->
  <script src="/ui/home.js"></script>
  <script src="/ui/verify.js"></script>
  <script src="/ui/explore.js"></script>
  <script src="/ui/history.js"></script>
  <script src="/ui/about.js"></script>

  <!-- Application -->
  <script src="/app.js"></script>

<!-- ICore Cross-PWA Navigation -->
<script src="nav-bar.js"></script>
</body>
</html>
