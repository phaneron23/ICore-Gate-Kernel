<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICore API Reference</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--surface:#12121a;--card:#1a1a25;--border:#2a2a3a;--accent:#6c5ce7;--accent2:#00cec9;--green:#00b894;--text:#e0e0e0;--dim:#888899;--code-bg:#0d0d14;--mono:'SF Mono','Cascadia Code','Consolas',monospace;--sans:-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh}
header{padding:2rem;border-bottom:1px solid var(--border);text-align:center}
header h1{font-size:1.8rem;font-weight:700}
header h1 span{color:var(--accent)}
header p{color:var(--dim);margin-top:.4rem;font-size:.9rem}
.nav{display:flex;gap:1rem;padding:1rem 2rem;border-bottom:1px solid var(--border);overflow-x:auto;flex-wrap:wrap}
.nav a{color:var(--dim);text-decoration:none;font-size:.8rem;font-family:var(--mono);padding:.4rem .8rem;border-radius:4px;transition:all .2s;white-space:nowrap}
.nav a:hover,.nav a.active{color:var(--accent);background:rgba(108,92,231,.1)}
.container{max-width:900px;margin:0 auto;padding:1.5rem}
.module{margin-bottom:2.5rem}
.module-head{display:flex;align-items:center;gap:1rem;margin-bottom:1rem}
.module-head h2{font-size:1.3rem;font-weight:700}
.module-head .badge{font-size:.65rem;font-family:var(--mono);padding:.2rem .6rem;border-radius:12px;background:rgba(108,92,231,.15);color:var(--accent)}
.endpoint{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:1.2rem;margin-bottom:.8rem}
.endpoint h3{font-size:.95rem;font-weight:600;margin-bottom:.3rem}
.endpoint h3 .method{font-family:var(--mono);font-size:.7rem;color:var(--accent2);margin-right:.5rem}
.endpoint p{color:var(--dim);font-size:.85rem;margin-bottom:.8rem}
pre{background:var(--code-bg);border:1px solid var(--border);border-radius:6px;padding:.8rem;overflow-x:auto;font-size:.8rem;font-family:var(--mono);line-height:1.5;color:var(--accent2)}
.try-it{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:1.5rem;margin-top:2rem}
.try-it h2{font-size:1.2rem;margin-bottom:1rem}
.try-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:700px){.try-row{grid-template-columns:1fr}}
.try-col label{display:block;font-size:.75rem;color:var(--dim);margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.06em}
textarea{width:100%;height:200px;background:var(--code-bg);border:1px solid var(--border);border-radius:6px;padding:.8rem;color:var(--text);font-family:var(--mono);font-size:.8rem;resize:vertical}
textarea:focus{outline:none;border-color:var(--accent)}
button{background:var(--accent);color:#fff;border:none;padding:.6rem 1.2rem;border-radius:6px;font-family:var(--sans);font-size:.85rem;font-weight:600;cursor:pointer;transition:opacity .2s;margin-top:.6rem}
button:hover{opacity:.85}
.output-box{background:var(--code-bg);border:1px solid var(--border);border-radius:6px;padding:.8rem;min-height:80px;font-family:var(--mono);font-size:.8rem;white-space:pre-wrap;color:var(--green)}
footer{text-align:center;padding:2rem;color:var(--dim);font-size:.75rem;border-top:1px solid var(--border);margin-top:2rem}
</style>
</head>
<body>
<header>
<h1>ICore <span>API Reference</span></h1>
<p>Constitutional API surface — modules, primitives, and contracts</p>
</header>
<nav class="nav" id="nav"></nav>
<div class="container" id="content"></div>
<footer>ICore Gate Kernel v1 · API Reference</footer>
<script>
const modules=[
{id:'uscp',name:'USCP Primitives',count:6,endpoints:[
{name:'Domain',desc:'Define a constitutional domain with boundaries and constraints.',json:`{\n  "primitive": "Domain",\n  "name": "UserContext",\n  "boundaries": ["auth", "profile"],\n  "constraints": ["immutable_id"]\n}`},
{name:'Rule',desc:'Express a constitutional rule that governs behavior within a domain.',json:`{\n  "primitive": "Rule",\n  "domain": "UserContext",\n  "name": "AuthRequired",\n  "body": "access(X) -> authenticated(X)"\n}`},
{name:'Proof',desc:'Construct a formal proof of a property within a domain.',json:`{\n  "primitive": "Proof",\n  "target": "AuthRequired",\n  "method": "deduction",\n  "premises": ["auth_def", "access_def"]\n}`},
{name:'Query',desc:'Query the constitutional state and retrieve validated information.',json:`{\n  "primitive": "Query",\n  "domain": "UserContext",\n  "select": ["user_id", "role"],\n  "where": {"authenticated": true}\n}`},
{name:'Constraint',desc:'Declare invariants that must hold across all operations.',json:`{\n  "primitive": "Constraint",\n  "name": "ImmutableID",\n  "scope": "UserContext",\n  "invariant": "unchanged(user_id)"\n}`},
{name:'Mutation',desc:'Describe a state change that respects all constraints.',json:`{\n  "primitive": "Mutation",\n  "domain": "UserContext",\n  "action": "updateProfile",\n  "guards": ["AuthRequired", "ImmutableID"]\n}`}
]},
{id:'usc',name:'USC Constitution',count:4,endpoints:[
{name:'Compose',desc:'Compose primitives into higher-order constitutional structures.',json:`{ "compose": ["Domain", "Rule"], "into": "ConstitutionalUnit" }`},
{name:'Evolve',desc:'Version-governed evolution of constitutional specifications.',json:`{ "evolve": "USC", "from": "1.0", "to": "2.0", "changes": ["added_mutation"] }`},
{name:'Validate',desc:'Run the USC validation suite against an implementation.',json:`{ "validate": "USC@2.0", "target": "my_impl", "strict": true }`},
{name:'Audit',desc:'Constitutional audit of compliance across all layers.',json:`{ "audit": "full", "layers": ["Foundation","Sciences","Reference"] }`}
]},
{id:'uce',name:'UCE Axioms',count:3,endpoints:[
{name:'Assert',desc:'Assert a knowledge claim within the epistemological framework.',json:`{ "assert": "knowledge(USCP)", "basis": "axiom.foundation" }`},
{name:'Infer',desc:'Apply epistemological inference rules to derive new knowledge.',json:`{ "infer": "from", "premises": ["P1","P2"], "rule": "modus_ponens" }`},
{name:'Refute',desc:'Challenge a claim with counter-evidence within the framework.',json:`{ "refute": "claim_x", "evidence": "counter_example_1" }`}
]},
{id:'corefab',name:'CoreFab Contracts',count:6,endpoints:[
{name:'Build',desc:'Compile a constitutional blueprint into an executable artifact.',json:`{ "build": "blueprint_v1", "target": "wasm", "optimize": true }`},
{name:'Deploy',desc:'Deploy a compiled artifact to an ICore runtime environment.',json:`{ "deploy": "artifact_id", "to": "uwa-runtime@prod" }`},
{name:'Test',desc:'Run the ICS compliance test suite against an artifact.',json:`{ "test": "artifact_id", "suite": "ics_full", "level": "constitutional" }`},
{name:'Rollback',desc:'Rollback a deployment to the previous constitutional version.',json:`{ "rollback": "deployment_id", "to_version": "1.0.2" }`},
{name:'Monitor',desc:'Monitor runtime health and constitutional compliance.',json:`{ "monitor": "deployment_id", "metrics": ["integrity","latency"] }`},
{name:'Certify',desc:'Issue a constitutional certification for a compliant artifact.',json:`{ "certify": "artifact_id", "level": "full", "valid_until": "2027-01-01" }`}
]},
{id:'uca',name:'UCA Adapter Domains',count:5,endpoints:[
{name:'WebAdapter',desc:'Bridge ICore to web-native protocols and APIs.',json:`{ "adapter": "WebAdapter", "protocol": "REST", "routes": ["/api/v1/*"] }`},
{name:'DataAdapter',desc:'Connect ICore to external data sources with constitutional constraints.',json:`{ "adapter": "DataAdapter", "source": "postgres", "constraints": ["schema_sync"] }`},
{name:'AIAdapter',desc:'Interface with AI/ML systems under constitutional governance.',json:`{ "adapter": "AIAdapter", "model": "llm_v3", "governance": "uce_axioms" }`},
{name:'IoTAdapter',desc:'Connect to IoT device networks with constraint-driven communication.',json:`{ "adapter": "IoTAdapter", "network": "mesh", "protocols": ["mqtt"] }`},
{name:'LegacyAdapter',desc:'Bridge legacy systems into the ICore constitutional framework.',json:`{ "adapter": "LegacyAdapter", "system": "mainframe_400", "transform": "graphql" }`}
]},
{id:'ics',name:'ICS Test Suites',count:3,endpoints:[
{name:'Conformance',desc:'Full constitutional conformance test suite for any ICore implementation.',json:`{ "suite": "Conformance", "version": "1.0", "modules": ["all"], "strict": true }`},
{name:'Integration',desc:'Integration tests across layer boundaries and adapter domains.',json:`{ "suite": "Integration", "layers": ["Foundation","Platforms"], "cross_layer": true }`},
{name:'Regression',desc:'Regression suite tracking known constitutional violations and fixes.',json:`{ "suite": "Regression", "since": "2026-06-01", "severity": ["critical","high"] }`}
]}
];
const nav=document.getElementById('nav');
const content=document.getElementById('content');
modules.forEach((m,i)=>{
const a=document.createElement('a');a.href='#'+m.id;a.textContent=m.name;
a.addEventListener('click',e=>{e.preventDefault();document.getElementById(m.id).scrollIntoView({behavior:'smooth'});nav.querySelectorAll('a').forEach(x=>x.classList.remove('active'));a.classList.add('active')});
if(i===0)a.classList.add('active');
nav.appendChild(a);
const sec=document.createElement('div');sec.className='module';sec.id=m.id;
sec.innerHTML=`<div class="module-head"><h2>${m.name}</h2><span class="badge">${m.count} ${m.count===1?'endpoint':'endpoints'}</span></div>`;
m.endpoints.forEach(ep=>{
const div=document.createElement('div');div.className='endpoint';
div.innerHTML=`<h3><span class="method">MODULE</span>${ep.name}</h3><p>${ep.desc}</p><pre>${ep.json}</pre>`;
sec.appendChild(div);
});
content.appendChild(sec);
});
// Try It
const trySection=document.createElement('div');
trySection.className='try-it';
trySection.innerHTML=`<h2>🧪 Try It</h2><div class="try-row"><div class="try-col"><label>Input (JSON)</label><textarea id="tryIn">{\n  "primitive": "Domain",\n  "name": "TestDomain",\n  "boundaries": ["scope_a"],\n  "constraints": ["inv_x"]\n}</textarea><button onclick="runTry()">Execute</button></div><div class="try-col"><label>Output</label><div class="output-box" id="tryOut">// Click Execute to run</div></div></div>`;
content.appendChild(trySection);
window.runTry=function(){
const inp=document.getElementById('tryIn').value;
const out=document.getElementById('tryOut');
try{
const obj=JSON.parse(inp);
const now=new Date().toISOString();
out.style.color='var(--green)';
out.textContent=`✓ Valid JSON\n  Timestamp: ${now}\n  Type: ${obj.primitive||'unknown'}\n  Module: ${obj.primitive?'uscp':'general'}\n  Keys: ${Object.keys(obj).join(', ')}\n\n// Processed successfully`;
}catch(e){
out.style.color='var(--red)';
out.textContent=`✗ Parse Error:\n${e.message}`;
}
};
</script>
</body>
</html>
