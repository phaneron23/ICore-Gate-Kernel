<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICore System Status</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--surface:#12121a;--card:#1a1a25;--border:#2a2a3a;--accent:#6c5ce7;--accent2:#00cec9;--green:#00b894;--yellow:#fdcb6e;--red:#e17055;--text:#e0e0e0;--dim:#888899;--mono:'SF Mono','Cascadia Code','Consolas','Liberation Mono',monospace;--sans:-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif}
body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;min-height:100vh}
header{padding:2rem;border-bottom:1px solid var(--border);text-align:center}
header h1{font-size:1.8rem;font-weight:700;letter-spacing:-0.02em}
header h1 span{color:var(--accent)}
header p{color:var(--dim);margin-top:.5rem;font-size:.9rem}
.top-bar{display:flex;justify-content:center;gap:2rem;padding:1.5rem;border-bottom:1px solid var(--border);flex-wrap:wrap}
.top-bar .metric{text-align:center}
.top-bar .metric .val{font-size:1.8rem;font-weight:700;font-family:var(--mono);color:var(--accent2)}
.top-bar .metric .lbl{font-size:.75rem;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.container{max-width:1100px;margin:0 auto;padding:1.5rem}
.section-title{font-size:1.1rem;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin:1.5rem 0 1rem}
.layers{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:1.2rem;transition:border-color .2s}
.card:hover{border-color:var(--accent)}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem}
.card-head h3{font-size:1rem;font-weight:600}
.status-badge{font-size:.7rem;font-family:var(--mono);padding:.2rem .6rem;border-radius:12px;text-transform:uppercase;letter-spacing:.05em}
.status-badge.operational{background:rgba(0,184,148,.15);color:var(--green)}
.status-badge.verified{background:rgba(108,92,231,.15);color:var(--accent)}
.status-badge.pending{background:rgba(253,203,110,.15);color:var(--yellow)}
.card-body{font-size:.85rem;color:var(--dim)}
.card-body .row{display:flex;justify-content:space-between;padding:.3rem 0;border-bottom:1px solid rgba(255,255,255,.04)}
.card-body .row:last-child{border:none}
.card-body .row .k{color:var(--text)}
.subdomains{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.6rem;margin-top:.5rem}
.sub-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:.8rem;text-align:center;cursor:pointer;transition:all .2s}
.sub-card:hover{border-color:var(--accent2);transform:translateY(-2px)}
.sub-card .name{font-family:var(--mono);font-size:.85rem;font-weight:600}
.sub-card .sub-status{font-size:.65rem;margin-top:.3rem;text-transform:uppercase;letter-spacing:.05em}
.sub-card .sub-status.ok{color:var(--green)}
.sub-card .sub-status.ver{color:var(--accent)}
.sub-card .sub-status.pnd{color:var(--yellow)}
footer{text-align:center;padding:2rem;color:var(--dim);font-size:.75rem;border-top:1px solid var(--border);margin-top:2rem}
</style>
</head>
<body>
<header>
<h1>ICore <span>System Status</span></h1>
<p>Constitutional health of the ICore ecosystem</p>
</header>
<div class="top-bar">
<div class="metric"><div class="val" id="integrity">97.3%</div><div class="lbl">Constitutional Integrity</div></div>
<div class="metric"><div class="val" id="lastAudit">—</div><div class="lbl">Last Audit</div></div>
<div class="metric"><div class="val">5</div><div class="lbl">Layers Active</div></div>
<div class="metric"><div class="val">9</div><div class="lbl">Subdomains</div></div>
</div>
<div class="container">
<div class="div class="section-title">Layer Health</div>
<div class="layers" id="layers"></div>
<div class="section-title">Subdomain Status</div>
<div class="subdomains" id="subs"></div>
</div>
<footer>ICore Gate Kernel v1 · System Status Dashboard</footer>
<script>
const layers=[
{name:'Foundation',version:'1.0.0',status:'operational',verified:'2026-07-15',desc:'USCP primitives & USC constitution'},
{name:'Sciences',version:'2.1.0',status:'verified',verified:'2026-07-14',desc:'UCE · UCC · UCM · UCL'},
{name:'Reference Systems',version:'1.3.0',status:'verified',verified:'2026-07-13',desc:'UCRS · UCModels · URS · UVS'},
{name:'Platforms',version:'2.0.0',status:'operational',verified:'2026-07-15',desc:'UWA · UCN · USR · UCA'},
{name:'Applications',version:'1.1.0',status:'pending',verified:'2026-07-12',desc:'UCD · ICS · Studyo'}
];
const subs=[
{name:'USCP',status:'ok'},{name:'USC',status:'ok'},{name:'UCE',status:'ver'},
{name:'UCC',status:'ver'},{name:'UCM',status:'ver'},{name:'UCR',status:'ver'},
{name:'UCD',status:'pnd'},{name:'ICS',status:'pnd'},{name:'Studyo',status:'pnd'}
];
const statusLabel={ok:'Operational',ver:'Verified',pnd:'Pending',operational:'Operational',verified:'Verified',pending:'Pending'};
const $l=document.getElementById('layers');
layers.forEach(l=>{
const card=document.createElement('div');card.className='card';
card.innerHTML=`<div class="card-head"><h3>${l.name}</h3><span class="status-badge ${l.status}">${l.status}</span></div><div class="card-body"><div class="row"><span class="k">Version</span><span>${l.version}</span></div><div class="row"><span class="k">Last Verified</span><span>${l.verified}</span></div><div class="row"><span class="k">Scope</span><span>${l.desc}</span></div></div>`;
$l.appendChild(card);
});
const $s=document.getElementById('subs');
subs.forEach(s=>{
const el=document.createElement('div');el.className='sub-card';
el.innerHTML=`<div class="name">${s.name}</div><div class="sub-status ${s.status}">${statusLabel[s.status]}</div>`;
$s.appendChild(el);
});
document.getElementById('lastAudit').textContent=new Date().toISOString().slice(0,10);
</script>
</body>
</html>
